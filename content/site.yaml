# --- Aviso de temporada -------------------------------------------------------
# Se muestra automáticamente SOLO en julio y agosto (lo controla el navegador).
# ACTUALIZA cada año la fecha de inicio (primer lunes o miércoles laborable de septiembre).
season:
  course_start: "miércoles 2 de septiembre"
  # {start} se sustituye por course_start. Puedes editar el texto libremente.
  message: "En agosto cerramos por vacaciones. El nuevo curso comienza el {start} (siempre el primer lunes o miércoles laborable de septiembre)."

# --- Imán de leads: PDF gratis del manual a cambio del email --------------------
# Para activar MailerLite: pon provider "mailerlite" y rellena los dos IDs de abajo.
lead_magnet:
  # Proveedor: "mailto" (funciona ya, sin configurar), "mailerlite" o "formspree"
  provider: "mailerlite"
  # --- MailerLite ---
  # 1) mailerlite_account: el número de tu cuenta. Aparece en el script de MailerLite
  #    como  ml('account', '123456')  -> aquí pondrías  "123456"
  mailerlite_account: "2521369"
  # 2) mailerlite_form: el identificador del formulario embebido. Aparece como
  #    <div class="ml-embedded" data-form="xxxxxx">  -> aquí pondrías  "xxxxxx"
  mailerlite_form: "PttuCZ"
  # --- Formspree (alternativa) ---
  formspree_id: "TU_ID_FORMSPREE"
  success_url: "/gracias.html"

manual:
  title: "Manual de Defensa Personal para Mujeres"
  author: "Jorge Aranda Moro"
  price: "8,00 €"
  pages: 58
  format: "Rústica · 148 × 210 mm"
  isbn: "9791044530059"
  year: "2026"
  cover_url: "https://www.coollibri.es/Project4/d14f1195-79c7-45b2-b3ad-7c24b3b6a4a1/56474/couverture_12072026193551.png"
  buy_url: "https://www.coollibri.es/Infos/ContacterAuteur/aranda-moro-jorge?titre=manual-de-defensa-personal-para-mujeres_56474"
  coollibri_url: "https://www.coollibri.es/biblioteca-libros-autoedicion/aranda-moro-jorge/manual-de-defensa-personal-para-mujeres_56474"
  # Nombre del PDF que envías/regalas (colócalo en static/downloads/ si lo sirves tú)
  pdf_file: "/downloads/manual-defensa-personal-mujeres.pdf"
  summary: >
    El objetivo del manual es lograr la mentalización necesaria para hacer frente
    a una situación de agresión, potenciando tus habilidades y capacidades de defensa.
    Esta edición revisada está orientada específicamente a la mujer.
  highlights:
    - "Evidencia científica sobre la eficacia de la autodefensa femenina."
    - "Marco legal español actualizado: qué puedes y qué no puedes hacer."
    - "Herramientas tecnológicas: apps móviles de seguridad ciudadana."
    - "Enfoque práctico: prevención, gestión del conflicto y técnicas sencillas y eficaces."

author:
  name: "Jorge Aranda Moro"
  role: "Instructor de defensa personal y divulgador tecnológico"
  bio: >
    Ha impartido cursos de defensa personal con especial dedicación a la formación de
    mujeres, con un enfoque basado en la prevención, la gestión del conflicto y el uso
    proporcionado de técnicas sencillas y eficaces. Su filosofía prioriza evitar la
    violencia siempre que sea posible y dotar a las alumnas de herramientas que aumenten
    su seguridad, confianza y capacidad de decisión.

