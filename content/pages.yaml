sambo:
  hero_eyebrow: "самозащита без оружия"
  hero_title: "Sambo"
  hero_lede: >
    En ruso significa, literalmente, «autodefensa sin armas». Un deporte de combate
    y sistema de defensa personal desarrollado en la antigua Unión Soviética, con
    raíces en el judo, la lucha, el boxeo y otras artes marciales.
  sections:
    - title: "¿Qué es el sambo?"
      body: >
        El sambo es un deporte de combate y sistema de defensa personal desarrollado
        en la antigua Unión Soviética, con una variante —la «Lucha Sambo»— reconocida
        como deporte nacional en 1938. Bebe de estilos tradicionales como el judo, el
        savate, el jiu-jitsu, el boxeo, el kárate, el kung-fu y la lucha olímpica. Es
        un arte marcial sorprendentemente integral: para muchos expertos, pocos
        sistemas son tan completos.
    - title: "Origen"
      body: >
        Nace de la lucha tradicional rusa y del judo japonés. Lo desarrollaron en los
        años 20 y 30 los oficiales soviéticos Vasili Oshchepkov —que había estudiado
        judo en Japón— y Viktor Spiridonov, buscando un sistema eficaz tanto en
        competición como en combate cuerpo a cuerpo. El nombre es el acrónimo de
        «SAMozashchita Bez Oruzhiya»: autodefensa sin armas. La primera competición
        oficial se celebró en 1928 y desde entonces no ha dejado de crecer por todo el
        mundo.
    - title: "Fundamentos"
      body: >
        Combina técnicas de lucha libre, judo y otras artes marciales, con especial
        énfasis en el control del cuerpo y el uso de llaves y sumisiones. Trabaja la
        condición física, la técnica de lucha y la defensa personal a la vez. Su
        carácter integral lo hace ideal para quien busca una base sólida y completa,
        también de cara a las artes marciales mixtas.
    - title: "Beneficios"
      body: >
        Mejora la condición física general, la coordinación, el equilibrio y la
        flexibilidad, y fortalece músculos y resistencia cardiovascular. Pero también
        entrena la cabeza: concentración, paciencia, perseverancia y confianza en uno
        mismo. Con la práctica desarrollas una mayor conciencia de tu cuerpo y una
        capacidad de reacción que marca la diferencia en situaciones de riesgo.
  cta_title: "Ven a probar un entrenamiento"
  cta_text: "Lunes, miércoles y viernes de 21:15 a 22:30 h. La primera clase es gratis y sin compromiso."

defensa:
  hero_eyebrow: "Defensa personal para mujeres"
  hero_title: "Recursos reales para defenderte"
  hero_lede: >
    Todos los instructores de Sambo DP Bilbao estamos concienciados con el problema
    de la violencia contra la mujer. Queremos darte herramientas para defenderte de
    forma eficaz ante una agresión, sea cual sea tu edad, tu experiencia previa o tu
    condición física.
  formats_title: "Dos formas de formarte"
  formats:
    - title: "Clases semanales"
      text: "Lunes y miércoles al mediodía. Para trabajar la técnica de forma continua y afianzarla con el tiempo."
    - title: "Seminarios intensivos"
      text: "De 8 horas mínimo, con reserva previa. Organizamos al menos dos al año en Bilbao para practicar y asimilar el temario con eficacia."
    - title: "Grupos a medida"
      text: "¿Ya sois un grupo de 6 o más? Impartimos el seminario para vosotras en las fechas que mejor os vengan."
  program_title: "Un programa específico"
  program_body: >
    Nuestro programa está pensado para que cualquier mujer pueda afrontar con eficacia,
    y sin necesidad de fuerza física, las situaciones en las que pueda encontrarse. Es
    fruto del estudio constante de distintas artes marciales durante años, y reúne las
    técnicas más sencillas, cómodas y efectivas para un ataque callejero. No lo dudes:
    tienes más recursos de los que crees.
  cta_title: "Escríbenos para las próximas fechas"
  cta_text: "Te contamos cuándo es el próximo seminario o preparamos uno para tu grupo."

